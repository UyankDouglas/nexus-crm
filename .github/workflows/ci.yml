name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus_ci_password
          POSTGRES_DB: nexus_crm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus_crm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Banco descartável do próprio job; nenhum segredo real é usado no CI.
      DATABASE_URL_TEST: postgresql://nexus:nexus_ci_password@localhost:5432/nexus_crm_test?schema=public
      CSRF_SECRET: ci-csrf-secret-com-mais-de-32-caracteres-para-testes
      VITE_CONFIG_NATIVE_IGNORE_WARNING: 'true'

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Formatação
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Testes unitários
        run: pnpm test

      - name: Testes de integração (PostgreSQL)
        run: pnpm test:integration

      - name: Build
        run: pnpm build
