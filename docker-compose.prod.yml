# NEXUS CRM — ambiente de produção (ou de demonstração isolado) em um único servidor com Docker.
#
#   cp .env.production.example .env.production   # e preencha os valores
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Demonstração pública isolada (opcional): popula as contas e os dados fictícios.
#   docker compose -f docker-compose.prod.yml --env-file .env.production --profile demo run --rm seed
#
# Topologia: Caddy (web) → /api → API (NestJS) → PostgreSQL. Só o Caddy publica portas.

name: nexus-crm-prod

x-database-url: &database-url postgresql://${POSTGRES_USER:-nexus}:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nexus_crm}?schema=public

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-nexus_crm}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  # Aplica as migrations antes de a API subir; encerra ao terminar.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  # Somente com --profile demo: contas e dados FICTÍCIOS para uma demonstração isolada.
  seed:
    profiles: [demo]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
    command: ['./node_modules/.bin/tsx', 'prisma/seed.ts']
    environment:
      DATABASE_URL: *database-url
      NODE_ENV: production
      DEMO_MODE: 'true'
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:?Defina SEED_DEMO_PASSWORD para a demonstração}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3333
      APP_URL: ${APP_URL:?Defina APP_URL (endereço público, ex. https://crm.suaempresa.com.br)}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      DATABASE_URL: *database-url
      CSRF_SECRET: ${CSRF_SECRET:?Defina CSRF_SECRET}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-300}
      RATE_LIMIT_AUTH_MAX: ${RATE_LIMIT_AUTH_MAX:-10}
      # A API fica atrás do Caddy: o IP real do cliente vem do cabeçalho X-Forwarded-For.
      TRUST_PROXY: 1
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-NEXUS CRM <nao-responda@nexuscrm.local>}
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
