packages:
  - apps/*
  - packages/*
  - e2e

# Dependências com scripts de instalação permitidos (pnpm 10 bloqueia por padrão).
onlyBuiltDependencies:
  - '@prisma/engines'
  - argon2
  - esbuild
  - prisma

# Correções de segurança em dependências transitivas (revisão da Fase 6, `pnpm audit`):
# multer (via @nestjs/platform-express; a API não recebe uploads) e js-yaml (via @nestjs/swagger).
overrides:
  multer: ^2.5.0
  'js-yaml@>=5.0.0 <5.4.1': ^5.4.1
